<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidates - DIJIT Talent Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .kanban-board { display: flex; gap: var(--space-4); overflow-x: auto; padding-bottom: var(--space-4); }
        .kanban-column { min-width: 280px; flex: 1; background: var(--bg-body); border-radius: var(--radius-lg); padding: var(--space-3); border: 1px solid var(--border-color); }
        .kanban-column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3); padding-bottom: var(--space-3); border-bottom: 2px solid var(--border-color); }
        .kanban-column-title { font-weight: 600; font-size: 0.875rem; }
        .kanban-count { background: var(--bg-body); border: 1px solid var(--border-color); border-radius: var(--radius-full); padding: 2px 8px; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }
        .kanban-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: var(--space-3); margin-bottom: var(--space-3); cursor: grab; transition: box-shadow 0.2s, transform 0.2s; }
        .kanban-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .kanban-card-name { font-weight: 600; font-size: 0.875rem; margin-bottom: 4px; }
        .kanban-card-role { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: var(--space-2); }
        .kanban-card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-secondary); }
        .kanban-avatar { width: 28px; height: 28px; border-radius: var(--radius-full); background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; }
        .col-applied .kanban-column-header { border-bottom-color: #6366F1; }
        .col-screening .kanban-column-header { border-bottom-color: #F59E0B; }
        .col-interview .kanban-column-header { border-bottom-color: #3B82F6; }
        .col-offered .kanban-column-header { border-bottom-color: #8B5CF6; }
        .col-hired .kanban-column-header { border-bottom-color: #10B981; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="index.html" class="sidebar-logo"><img src="../assets/images/Dijit_Talent_Cloud_Logo-removebg-preview.png" alt="DIJIT Logo" class="sidebar-logo-img"><span>Company</span></a></div>
            <nav class="sidebar-nav">
                <div class="nav-group"><div class="nav-group-title">Overview</div><a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a></div>
                <div class="nav-group">
                    <div class="nav-group-title">Hiring</div>
                    <a href="my-jobs.html" class="nav-item"><i data-lucide="briefcase"></i><span>My Jobs</span></a>
                    <a href="candidates.html" class="nav-item active"><i data-lucide="users"></i><span>Candidates</span></a>
                    <a href="resume-database.html" class="nav-item"><i data-lucide="search"></i><span>Resume Database</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">Management</div>
                    <a href="team-members.html" class="nav-item"><i data-lucide="user-plus"></i><span>Team Members</span></a>
                    <a href="billing-plan.html" class="nav-item"><i data-lucide="credit-card"></i><span>Billing & Plan</span></a>
                    <a href="company-settings.html" class="nav-item"><i data-lucide="settings"></i><span>Company Settings</span></a>
                </div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left"><button class="toggle-sidebar"><i data-lucide="menu" style="width:20px;height:20px;"></i></button><div class="global-search"><i data-lucide="search" style="width:16px;height:16px;"></i><input type="text" placeholder="Search candidates..." id="candidateSearch"><span class="shortcut">⌘K</span></div></div>
                <div class="header-right"><div class="avatar" style="cursor:pointer;">TC</div></div>
            </header>

            <main class="main-content fade-in">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Candidate Pipeline</h1>
                        <p class="text-muted" style="font-size:0.875rem; margin-top:2px;">Track candidates across all your open positions.</p>
                    </div>
                    <div style="display:flex; gap: var(--space-3);">
                        <select class="filter-select" id="jobFilter">
                            <option value="all">All Jobs</option>
                            <option value="sfe">Senior Frontend Engineer</option>
                            <option value="pm">Product Manager</option>
                            <option value="bd">Backend Developer</option>
                            <option value="ux">UX Designer</option>
                        </select>
                    </div>
                </div>

                <!-- KPI Row -->
                <div class="grid grid-cols-4 mb-6 fade-in">
                    <div class="kpi-card"><div class="kpi-top"><div><p class="kpi-label">Total Candidates</p><h3 class="kpi-value" id="kpiTotal">0</h3></div><div class="kpi-icon" style="background:#EEF2FF;color:#6366F1;"><i data-lucide="users" style="width:20px;height:20px;"></i></div></div></div>
                    <div class="kpi-card"><div class="kpi-top"><div><p class="kpi-label">In Interview</p><h3 class="kpi-value" id="kpiInterview">0</h3></div><div class="kpi-icon" style="background:#DBEAFE;color:#3B82F6;"><i data-lucide="video" style="width:20px;height:20px;"></i></div></div></div>
                    <div class="kpi-card"><div class="kpi-top"><div><p class="kpi-label">Offers Sent</p><h3 class="kpi-value" id="kpiOffers">0</h3></div><div class="kpi-icon" style="background:#F3E8FF;color:#8B5CF6;"><i data-lucide="send" style="width:20px;height:20px;"></i></div></div></div>
                    <div class="kpi-card"><div class="kpi-top"><div><p class="kpi-label">Hired This Month</p><h3 class="kpi-value" id="kpiHired">0</h3></div><div class="kpi-icon" style="background:var(--success-bg);color:var(--success);"><i data-lucide="check-circle" style="width:20px;height:20px;"></i></div></div></div>
                </div>

                <!-- Kanban Board -->
                <div class="kanban-board" id="kanbanBoard"></div>
            </main>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const candidates = [
            { name: 'Ananya Sharma', initials: 'AS', role: 'Senior Frontend Engineer', exp: '6 yrs', stage: 'applied', date: '2 days ago' },
            { name: 'Vikram Patel', initials: 'VP', role: 'Senior Frontend Engineer', exp: '8 yrs', stage: 'applied', date: '1 day ago' },
            { name: 'Priya Nair', initials: 'PN', role: 'Product Manager', exp: '5 yrs', stage: 'applied', date: '3 days ago' },
            { name: 'Rohan Mehta', initials: 'RM', role: 'Senior Frontend Engineer', exp: '7 yrs', stage: 'screening', date: '4 days ago' },
            { name: 'Deepa Gupta', initials: 'DG', role: 'Product Manager', exp: '4 yrs', stage: 'screening', date: '5 days ago' },
            { name: 'Arjun Reddy', initials: 'AR', role: 'Backend Developer', exp: '5 yrs', stage: 'screening', date: '3 days ago' },
            { name: 'Neha Kapoor', initials: 'NK', role: 'Senior Frontend Engineer', exp: '9 yrs', stage: 'interview', date: '1 week ago' },
            { name: 'Karthik Iyer', initials: 'KI', role: 'Backend Developer', exp: '6 yrs', stage: 'interview', date: '1 week ago' },
            { name: 'Sanya Joshi', initials: 'SJ', role: 'UX Designer', exp: '4 yrs', stage: 'interview', date: '5 days ago' },
            { name: 'Amit Deshmukh', initials: 'AD', role: 'Product Manager', exp: '7 yrs', stage: 'offered', date: '2 weeks ago' },
            { name: 'Rhea Sen', initials: 'RS', role: 'Senior Frontend Engineer', exp: '10 yrs', stage: 'offered', date: '1 week ago' },
            { name: 'Suresh Kumar', initials: 'SK', role: 'Backend Developer', exp: '8 yrs', stage: 'hired', date: '3 weeks ago' },
            { name: 'Megha Rao', initials: 'MR', role: 'UX Designer', exp: '5 yrs', stage: 'hired', date: '2 weeks ago' },
        ];

        const stages = [
            { key: 'applied', title: 'Applied', cssClass: 'col-applied' },
            { key: 'screening', title: 'Screening', cssClass: 'col-screening' },
            { key: 'interview', title: 'Interview', cssClass: 'col-interview' },
            { key: 'offered', title: 'Offered', cssClass: 'col-offered' },
            { key: 'hired', title: 'Hired', cssClass: 'col-hired' },
        ];

        function renderBoard(filter = 'all') {
            const board = document.getElementById('kanbanBoard');
            board.innerHTML = '';
            const filtered = filter === 'all' ? candidates : candidates.filter(c => {
                if (filter === 'sfe') return c.role.includes('Frontend');
                if (filter === 'pm') return c.role.includes('Product');
                if (filter === 'bd') return c.role.includes('Backend');
                if (filter === 'ux') return c.role.includes('UX');
                return true;
            });

            stages.forEach(stage => {
                const cards = filtered.filter(c => c.stage === stage.key);
                const col = document.createElement('div');
                col.className = `kanban-column ${stage.cssClass}`;
                col.innerHTML = `
                    <div class="kanban-column-header">
                        <span class="kanban-column-title">${stage.title}</span>
                        <span class="kanban-count">${cards.length}</span>
                    </div>
                    ${cards.map(c => `
                        <div class="kanban-card">
                            <div style="display:flex; align-items:center; gap: var(--space-2); margin-bottom: var(--space-2);">
                                <div class="kanban-avatar">${c.initials}</div>
                                <div>
                                    <div class="kanban-card-name">${c.name}</div>
                                    <div class="kanban-card-role">${c.role}</div>
                                </div>
                            </div>
                            <div class="kanban-card-meta">
                                <span>${c.exp} exp</span>
                                <span>${c.date}</span>
                            </div>
                        </div>
                    `).join('')}
                `;
                board.appendChild(col);
            });

            // Update KPIs
            document.getElementById('kpiTotal').textContent = filtered.length;
            document.getElementById('kpiInterview').textContent = filtered.filter(c => c.stage === 'interview').length;
            document.getElementById('kpiOffers').textContent = filtered.filter(c => c.stage === 'offered').length;
            document.getElementById('kpiHired').textContent = filtered.filter(c => c.stage === 'hired').length;
        }

        renderBoard();

        document.getElementById('jobFilter').addEventListener('change', (e) => {
            renderBoard(e.target.value);
        });

        document.getElementById('candidateSearch').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.kanban-card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(val) ? '' : 'none';
            });
        });
    });
    </script>
</body>
</html>
