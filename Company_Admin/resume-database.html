<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Database - DIJIT Talent Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .search-hero { background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); border-radius: var(--radius-lg); padding: var(--space-6); margin-bottom: var(--space-6); color: #fff; }
        .search-hero h2 { font-size: 1.25rem; margin-bottom: var(--space-3); }
        .search-bar-wrapper { display: flex; gap: var(--space-3); }
        .search-bar-wrapper input { flex: 1; padding: 10px 16px; border: none; border-radius: var(--radius-md); font-size: 0.875rem; outline: none; }
        .search-bar-wrapper button { padding: 10px 20px; border: none; border-radius: var(--radius-md); background: #fff; color: #6366F1; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .search-bar-wrapper button:hover { background: #EEF2FF; }
        .filter-row { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); flex-wrap: wrap; }
        .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4); }
        .profile-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--space-4); transition: box-shadow 0.2s, transform 0.2s; }
        .profile-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
        .profile-header { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
        .profile-avatar { width: 48px; height: 48px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; flex-shrink: 0; }
        .profile-name { font-weight: 600; font-size: 0.9375rem; }
        .profile-title { font-size: 0.8125rem; color: var(--text-secondary); }
        .profile-skills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-3); }
        .skill-tag { background: var(--bg-body); border: 1px solid var(--border-color); border-radius: var(--radius-full); padding: 2px 10px; font-size: 0.75rem; color: var(--text-secondary); }
        .profile-meta { display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-3); border-top: 1px solid var(--border-color); font-size: 0.8125rem; color: var(--text-secondary); }
        .unlock-btn { padding: 6px 14px; border: 1px solid var(--primary); background: transparent; color: var(--primary); border-radius: var(--radius-md); font-size: 0.8125rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .unlock-btn:hover { background: var(--primary); color: #fff; }
        .unlock-btn.unlocked { background: var(--success-bg); color: var(--success); border-color: var(--success); cursor: default; }
        .credits-bar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); margin-bottom: var(--space-6); }
        .credits-bar-fill { height: 6px; border-radius: var(--radius-full); background: var(--primary); }
        .credits-bar-bg { height: 6px; border-radius: var(--radius-full); background: var(--border-color); flex: 1; overflow: hidden; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="index.html" class="sidebar-logo"><img src="../assets/images/Dijit_Talent_Cloud_Logo-removebg-preview.png" alt="DIJIT Logo" class="sidebar-logo-img"><span>Company</span></a></div>
            <nav class="sidebar-nav">
                <div class="nav-group"><div class="nav-group-title">Overview</div><a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a></div>
                <div class="nav-group">
                    <div class="nav-group-title">Hiring</div>
                    <a href="my-jobs.html" class="nav-item"><i data-lucide="briefcase"></i><span>My Jobs</span></a>
                    <a href="candidates.html" class="nav-item"><i data-lucide="users"></i><span>Candidates</span></a>
                    <a href="resume-database.html" class="nav-item active"><i data-lucide="search"></i><span>Resume Database</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">Management</div>
                    <a href="team-members.html" class="nav-item"><i data-lucide="user-plus"></i><span>Team Members</span></a>
                    <a href="billing-plan.html" class="nav-item"><i data-lucide="credit-card"></i><span>Billing & Plan</span></a>
                    <a href="company-settings.html" class="nav-item"><i data-lucide="settings"></i><span>Company Settings</span></a>
                </div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left"><button class="toggle-sidebar"><i data-lucide="menu" style="width:20px;height:20px;"></i></button></div>
                <div class="header-right"><div class="avatar" style="cursor:pointer;">TC</div></div>
            </header>

            <main class="main-content fade-in">
                <div class="search-hero">
                    <h2>Find Your Next Great Hire</h2>
                    <p style="margin-bottom: var(--space-4); opacity: 0.9; font-size: 0.875rem;">Search through thousands of verified candidate profiles.</p>
                    <div class="search-bar-wrapper">
                        <input type="text" placeholder="Search by skill, role, or keyword..." id="resumeSearch">
                        <button id="searchBtn">Search</button>
                    </div>
                </div>

                <!-- Credits Indicator -->
                <div class="credits-bar">
                    <i data-lucide="unlock" style="width:16px; height:16px; color: var(--primary);"></i>
                    <span style="font-size: 0.875rem; font-weight: 600;">Resume Unlocks:</span>
                    <div class="credits-bar-bg"><div class="credits-bar-fill" id="creditsBarFill" style="width: 76%;"></div></div>
                    <span style="font-size: 0.875rem; font-weight: 600;" id="creditsText">380 / 500 used</span>
                </div>

                <!-- Filters -->
                <div class="filter-row">
                    <select class="filter-select" id="filterExp"><option value="all">All Experience</option><option value="0-2">0-2 years</option><option value="3-5">3-5 years</option><option value="6-8">6-8 years</option><option value="9+">9+ years</option></select>
                    <select class="filter-select" id="filterLocation"><option value="all">All Locations</option><option value="Bangalore">Bangalore</option><option value="Mumbai">Mumbai</option><option value="Delhi">Delhi</option><option value="Remote">Remote</option><option value="Pune">Pune</option></select>
                    <select class="filter-select" id="filterSkill"><option value="all">All Skills</option><option value="React">React</option><option value="Node.js">Node.js</option><option value="Python">Python</option><option value="Java">Java</option><option value="Figma">Figma</option></select>
                </div>

                <!-- Profile Grid -->
                <div class="profile-grid" id="profileGrid"></div>
            </main>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const colors = ['#6366F1', '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#14B8A6'];
        let unlockCount = 380;
        const totalUnlocks = 500;

        const profiles = [
            { name: 'Aditya Verma', initials: 'AV', title: 'Full Stack Developer', exp: '6 yrs', location: 'Bangalore', skills: ['React', 'Node.js', 'MongoDB', 'AWS'], unlocked: false },
            { name: 'Sneha Pillai', initials: 'SP', title: 'UX/UI Designer', exp: '4 yrs', location: 'Mumbai', skills: ['Figma', 'Sketch', 'CSS', 'User Research'], unlocked: false },
            { name: 'Rajesh Tiwari', initials: 'RT', title: 'Backend Engineer', exp: '8 yrs', location: 'Delhi', skills: ['Java', 'Spring Boot', 'Microservices', 'Kafka'], unlocked: true },
            { name: 'Divya Menon', initials: 'DM', title: 'Product Analyst', exp: '3 yrs', location: 'Remote', skills: ['SQL', 'Python', 'Tableau', 'A/B Testing'], unlocked: false },
            { name: 'Manish Jain', initials: 'MJ', title: 'DevOps Engineer', exp: '7 yrs', location: 'Pune', skills: ['Docker', 'Kubernetes', 'AWS', 'Terraform'], unlocked: false },
            { name: 'Pooja Singh', initials: 'PS', title: 'Frontend Developer', exp: '5 yrs', location: 'Bangalore', skills: ['React', 'TypeScript', 'Next.js', 'Tailwind'], unlocked: true },
            { name: 'Nikhil Saxena', initials: 'NS', title: 'Data Scientist', exp: '4 yrs', location: 'Remote', skills: ['Python', 'TensorFlow', 'SQL', 'Pandas'], unlocked: false },
            { name: 'Kavita Reddy', initials: 'KR', title: 'QA Lead', exp: '9 yrs', location: 'Mumbai', skills: ['Selenium', 'Cypress', 'JIRA', 'API Testing'], unlocked: false },
            { name: 'Gaurav Mishra', initials: 'GM', title: 'Mobile Developer', exp: '5 yrs', location: 'Delhi', skills: ['React Native', 'Flutter', 'Firebase', 'Swift'], unlocked: false },
            { name: 'Lakshmi Nair', initials: 'LN', title: 'Cloud Architect', exp: '10 yrs', location: 'Bangalore', skills: ['AWS', 'Azure', 'GCP', 'Terraform'], unlocked: true },
            { name: 'Sahil Chaudhary', initials: 'SC', title: 'Frontend Engineer', exp: '2 yrs', location: 'Pune', skills: ['React', 'JavaScript', 'CSS', 'HTML'], unlocked: false },
            { name: 'Tanvi Bhatt', initials: 'TB', title: 'ML Engineer', exp: '6 yrs', location: 'Remote', skills: ['Python', 'PyTorch', 'NLP', 'Computer Vision'], unlocked: false },
        ];

        function renderProfiles(filteredProfiles) {
            const grid = document.getElementById('profileGrid');
            grid.innerHTML = '';
            filteredProfiles.forEach((p, i) => {
                const color = colors[i % colors.length];
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.dataset.index = i;
                card.innerHTML = `
                    <div class="profile-header">
                        <div class="profile-avatar" style="background: ${color}20; color: ${color};">${p.initials}</div>
                        <div>
                            <div class="profile-name">${p.unlocked ? p.name : p.name.split(' ')[0][0] + '****** ' + p.name.split(' ')[1][0] + '******'}</div>
                            <div class="profile-title">${p.title} · ${p.exp}</div>
                        </div>
                    </div>
                    <div class="profile-skills">${p.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}</div>
                    <div class="profile-meta">
                        <span><i data-lucide="map-pin" style="width:12px;height:12px;display:inline;vertical-align:-2px;"></i> ${p.location}</span>
                        <button class="unlock-btn ${p.unlocked ? 'unlocked' : ''}" data-idx="${i}">${p.unlocked ? '✓ Unlocked' : 'Unlock Profile'}</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            if (window.lucide) lucide.createIcons();

            // Rebind unlock buttons
            document.querySelectorAll('.unlock-btn:not(.unlocked)').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    if (unlockCount < totalUnlocks) {
                        profiles[idx].unlocked = true;
                        unlockCount++;
                        updateCreditsBar();
                        applyFilters();
                    }
                });
            });
        }

        function updateCreditsBar() {
            const perc = (unlockCount / totalUnlocks) * 100;
            document.getElementById('creditsBarFill').style.width = perc + '%';
            document.getElementById('creditsText').textContent = `${unlockCount} / ${totalUnlocks} used`;
        }

        function applyFilters() {
            let filtered = [...profiles];
            const search = document.getElementById('resumeSearch').value.toLowerCase();
            const exp = document.getElementById('filterExp').value;
            const loc = document.getElementById('filterLocation').value;
            const skill = document.getElementById('filterSkill').value;

            if (search) filtered = filtered.filter(p => p.title.toLowerCase().includes(search) || p.skills.some(s => s.toLowerCase().includes(search)) || p.name.toLowerCase().includes(search));
            if (loc !== 'all') filtered = filtered.filter(p => p.location === loc);
            if (skill !== 'all') filtered = filtered.filter(p => p.skills.includes(skill));
            if (exp !== 'all') {
                filtered = filtered.filter(p => {
                    const y = parseInt(p.exp);
                    if (exp === '0-2') return y <= 2;
                    if (exp === '3-5') return y >= 3 && y <= 5;
                    if (exp === '6-8') return y >= 6 && y <= 8;
                    if (exp === '9+') return y >= 9;
                    return true;
                });
            }
            renderProfiles(filtered);
        }

        renderProfiles(profiles);

        document.getElementById('searchBtn').addEventListener('click', applyFilters);
        document.getElementById('resumeSearch').addEventListener('input', applyFilters);
        document.getElementById('filterExp').addEventListener('change', applyFilters);
        document.getElementById('filterLocation').addEventListener('change', applyFilters);
        document.getElementById('filterSkill').addEventListener('change', applyFilters);
    });
    </script>
</body>
</html>
