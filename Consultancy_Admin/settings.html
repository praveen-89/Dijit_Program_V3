<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - DIJIT Talent Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .settings-section { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--space-6); margin-bottom: var(--space-6); }
        .form-group { margin-bottom: var(--space-4); }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: var(--space-2); }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.875rem; outline: none; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--success); color: #fff; padding: 12px 24px; border-radius: var(--radius-md); font-size: 0.875rem; z-index: 9999; display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="index.html" class="sidebar-logo"><img src="../assets/images/DTC Logo.png" alt="DTC Logo" class="sidebar-logo-img" style="height: 32px; border-radius: 4px;"><span>Consultancy</span></a></div>
            <nav class="sidebar-nav">
                <div class="nav-group"><div class="nav-group-title">Overview</div><a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a></div>
                <div class="nav-group">
                    <div class="nav-group-title">Workflow</div>
                    <a href="client-reqs.html" class="nav-item"><i data-lucide="clipboard-list"></i><span>Client Reqs</span></a>
                    <a href="sourcing.html" class="nav-item"><i data-lucide="users"></i><span>Sourcing</span></a>
                    <a href="resume-database.html" class="nav-item"><i data-lucide="search"></i><span>Resume Database</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">Management</div>
                    <a href="team-members.html" class="nav-item"><i data-lucide="user-plus"></i><span>Team Members</span></a>
                    <a href="billing-plan.html" class="nav-item"><i data-lucide="credit-card"></i><span>Billing & Plan</span></a>
                    <a href="settings.html" class="nav-item active"><i data-lucide="settings"></i><span>Settings</span></a>
                </div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left"><button class="toggle-sidebar"><i data-lucide="menu" style="width:20px;height:20px;"></i></button></div>
                <div class="header-right"><div class="avatar" style="cursor:pointer;">PF</div></div>
            </header>

            <main class="main-content fade-in">
                <div class="page-header">
                    <h1 class="page-title">Agency Settings</h1>
                </div>

                <div class="settings-section" style="max-width: 600px;">
                    <h3 style="margin-bottom:16px;">Agency Profile</h3>
                    <div class="form-group"><label>Agency Name</label><input type="text" value="PeopleFirst HR Solutions"></div>
                    <div class="form-group"><label>Website</label><input type="text" value="https://peoplefirst.com"></div>
                    <div class="form-group"><label>Primary Contact Email</label><input type="email" value="admin@peoplefirst.com"></div>
                    <button class="btn btn-primary" id="saveBtn">Save Changes</button>
                </div>
            </main>
        </div>
    </div>
    <div class="toast" id="toast">Settings saved successfully!</div>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('saveBtn').addEventListener('click', () => {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        });
    </script>
</body>
</html>
