<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sourcing - DIJIT Talent Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .kanban-board { display: flex; gap: var(--space-4); overflow-x: auto; padding-bottom: var(--space-4); min-height: calc(100vh - 200px); }
        .kanban-column { flex: 0 0 320px; background: var(--bg-body); border-radius: var(--radius-lg); display: flex; flex-direction: column; max-height: 100%; border: 1px solid var(--border-color); }
        .kanban-header { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .kanban-title { font-weight: 600; font-size: 0.875rem; display: flex; align-items: center; gap: 8px; }
        .kanban-count { background: var(--bg-body); padding: 2px 8px; border-radius: var(--radius-full); font-size: 0.75rem; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .kanban-cards { padding: var(--space-3); overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: var(--space-3); }
        .k-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: var(--space-3); cursor: grab; transition: box-shadow 0.2s, border-color 0.2s; box-shadow: var(--shadow-sm); }
        .k-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
        .k-card:active { cursor: grabbing; }
        .k-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-2); }
        .k-card-title { font-weight: 600; font-size: 0.875rem; color: var(--text-primary); }
        .k-card-subtitle { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: var(--space-2); }
        .k-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-3); border-top: 1px solid var(--border-color); padding-top: var(--space-2); }
        .client-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: #EEF2FF; color: #6366F1; margin-bottom: 6px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="index.html" class="sidebar-logo"><img src="../assets/images/Dijit_Talent_Cloud_Logo-removebg-preview.png" alt="DIJIT Logo" class="sidebar-logo-img"><span>Consultancy</span></a></div>
            <nav class="sidebar-nav">
                <div class="nav-group"><div class="nav-group-title">Overview</div><a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a></div>
                <div class="nav-group">
                    <div class="nav-group-title">Workflow</div>
                    <a href="client-reqs.html" class="nav-item"><i data-lucide="clipboard-list"></i><span>Client Reqs</span></a>
                    <a href="sourcing.html" class="nav-item active"><i data-lucide="users"></i><span>Sourcing</span></a>
                    <a href="resume-database.html" class="nav-item"><i data-lucide="search"></i><span>Resume Database</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">Management</div>
                    <a href="team-members.html" class="nav-item"><i data-lucide="user-plus"></i><span>Team Members</span></a>
                    <a href="billing-plan.html" class="nav-item"><i data-lucide="credit-card"></i><span>Billing & Plan</span></a>
                    <a href="settings.html" class="nav-item"><i data-lucide="settings"></i><span>Settings</span></a>
                </div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left"><button class="toggle-sidebar"><i data-lucide="menu" style="width:20px;height:20px;"></i></button></div>
                <div class="header-right"><div class="avatar" style="cursor:pointer;">PF</div></div>
            </header>

            <main class="main-content fade-in" style="padding-bottom: 0;">
                <div class="toolbar">
                    <div>
                        <h1 class="page-title">Candidate Sourcing Pipeline</h1>
                        <p class="text-muted" style="font-size:0.875rem;">Drag and drop candidates across stages.</p>
                    </div>
                    <div style="display:flex; gap: var(--space-3);">
                        <select class="filter-select" id="reqFilter"><option value="all">All Requirements</option><option>Senior Frontend Engineer</option><option>Risk Analyst</option><option>DevOps Lead</option></select>
                        <div class="global-search" style="margin:0;"><i data-lucide="search" style="width:16px;height:16px;"></i><input type="text" placeholder="Search candidate..." id="candSearch" style="width: 200px; background: #fff;"></div>
                    </div>
                </div>

                <div class="kanban-board" id="kanbanBoard">
                    <!-- Sourced -->
                    <div class="kanban-column">
                        <div class="kanban-header"><div class="kanban-title"><span style="width:8px;height:8px;border-radius:50%;background:#8B5CF6;"></span>Sourced</div><span class="kanban-count" id="count-sourced">0</span></div>
                        <div class="kanban-cards" id="col-sourced"></div>
                    </div>
                    <!-- Screening -->
                    <div class="kanban-column">
                        <div class="kanban-header"><div class="kanban-title"><span style="width:8px;height:8px;border-radius:50%;background:#3B82F6;"></span>Screening</div><span class="kanban-count" id="count-screening">0</span></div>
                        <div class="kanban-cards" id="col-screening"></div>
                    </div>
                    <!-- Submitted to Client -->
                    <div class="kanban-column">
                        <div class="kanban-header"><div class="kanban-title"><span style="width:8px;height:8px;border-radius:50%;background:#F59E0B;"></span>Client Review</div><span class="kanban-count" id="count-client">0</span></div>
                        <div class="kanban-cards" id="col-client"></div>
                    </div>
                    <!-- Client Interview -->
                    <div class="kanban-column">
                        <div class="kanban-header"><div class="kanban-title"><span style="width:8px;height:8px;border-radius:50%;background:#EC4899;"></span>Interviewing</div><span class="kanban-count" id="count-interview">0</span></div>
                        <div class="kanban-cards" id="col-interview"></div>
                    </div>
                    <!-- Offered/Placed -->
                    <div class="kanban-column">
                        <div class="kanban-header"><div class="kanban-title"><span style="width:8px;height:8px;border-radius:50%;background:#10B981;"></span>Placed</div><span class="kanban-count" id="count-placed">0</span></div>
                        <div class="kanban-cards" id="col-placed"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const candidates = [
            { id: 1, name: 'Ananya Sharma', role: 'Senior Frontend Engineer', client: 'TechCorp India', exp: '5 Yrs', stage: 'sourced' },
            { id: 2, name: 'Rohan Gupta', role: 'Senior Frontend Engineer', client: 'TechCorp India', exp: '6 Yrs', stage: 'screening' },
            { id: 3, name: 'Meera Patel', role: 'Risk Analyst', client: 'Zeta Financial', exp: '3 Yrs', stage: 'client' },
            { id: 4, name: 'Aditya Singh', role: 'DevOps Lead', client: 'CloudNine Solutions', exp: '8 Yrs', stage: 'interview' },
            { id: 5, name: 'Kavita Reddy', role: 'Senior Frontend Engineer', client: 'TechCorp India', exp: '7 Yrs', stage: 'placed' },
            { id: 6, name: 'Siddharth Roy', role: 'Risk Analyst', client: 'Zeta Financial', exp: '4 Yrs', stage: 'sourced' },
            { id: 7, name: 'Neha Joshi', role: 'DevOps Lead', client: 'CloudNine Solutions', exp: '9 Yrs', stage: 'screening' },
            { id: 8, name: 'Arjun Nair', role: 'Senior Frontend Engineer', client: 'TechCorp India', exp: '5 Yrs', stage: 'interview' }
        ];

        function renderKanban() {
            const search = document.getElementById('candSearch').value.toLowerCase();
            const req = document.getElementById('reqFilter').value;

            let filtered = [...candidates];
            if(req !== 'all') filtered = filtered.filter(c => c.role === req);
            if(search) filtered = filtered.filter(c => c.name.toLowerCase().includes(search) || c.client.toLowerCase().includes(search));

            ['sourced', 'screening', 'client', 'interview', 'placed'].forEach(stage => {
                const col = document.getElementById(`col-${stage}`);
                col.innerHTML = '';
                const stageCands = filtered.filter(c => c.stage === stage);
                document.getElementById(`count-${stage}`).textContent = stageCands.length;

                stageCands.forEach(c => {
                    col.innerHTML += `
                        <div class="k-card" draggable="true" data-id="${c.id}">
                            <div class="client-tag">${c.client}</div>
                            <div class="k-card-header">
                                <div><div class="k-card-title">${c.name}</div><div class="k-card-subtitle">${c.role}</div></div>
                                <button class="btn-ghost btn-icon" style="padding:0;"><i data-lucide="more-horizontal" style="width:16px;"></i></button>
                            </div>
                            <div class="k-card-footer">
                                <span style="font-size:0.75rem; color:var(--text-secondary);"><i data-lucide="briefcase" style="width:12px;height:12px;display:inline;vertical-align:middle;"></i> ${c.exp}</span>
                                <div class="avatar" style="width:20px;height:20px;font-size:0.6rem;">${c.name.charAt(0)}</div>
                            </div>
                        </div>
                    `;
                });
            });
            if (window.lucide) lucide.createIcons();
            attachDragEvents();
        }

        renderKanban();

        document.getElementById('candSearch').addEventListener('input', renderKanban);
        document.getElementById('reqFilter').addEventListener('change', renderKanban);

        function attachDragEvents() {
            const cards = document.querySelectorAll('.k-card');
            const cols = document.querySelectorAll('.kanban-cards');

            cards.forEach(card => {
                card.addEventListener('dragstart', () => { card.classList.add('dragging'); card.style.opacity = '0.5'; });
                card.addEventListener('dragend', () => { card.classList.remove('dragging'); card.style.opacity = '1'; });
            });

            cols.forEach(col => {
                col.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    const draggable = document.querySelector('.dragging');
                    if (draggable) col.appendChild(draggable);
                });
                col.addEventListener('drop', (e) => {
                    const draggable = document.querySelector('.dragging');
                    if(draggable) {
                        const id = parseInt(draggable.dataset.id);
                        const newStage = col.id.replace('col-', '');
                        const cIdx = candidates.findIndex(c => c.id === id);
                        if(cIdx > -1) { candidates[cIdx].stage = newStage; renderKanban(); }
                    }
                });
            });
        }
    });
    </script>
</body>
</html>
