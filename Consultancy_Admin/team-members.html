<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members - DIJIT Talent Cloud</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .member-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); margin-top: var(--space-6); }
        .member-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: var(--space-5); text-align: center; position: relative; }
        .member-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-body); color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 600; margin: 0 auto var(--space-3); border: 2px solid var(--border-color); }
        .member-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
        .member-email { font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: var(--space-3); }
        .member-role { display: inline-block; padding: 4px 12px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600; background: #EEF2FF; color: #6366F1; }
        .member-actions { position: absolute; top: 12px; right: 12px; }
        
        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--bg-card); border-radius: var(--radius-lg); padding: var(--space-6); width: 100%; max-width: 480px; box-shadow: var(--shadow-xl); }
        .modal-box h3 { margin-bottom: var(--space-5); }
        .form-group { margin-bottom: var(--space-4); }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: var(--space-2); }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.875rem; outline: none; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--success); color: #fff; padding: 12px 24px; border-radius: var(--radius-md); font-size: 0.875rem; z-index: 9999; display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="index.html" class="sidebar-logo"><img src="../assets/images/Dijit_Talent_Cloud_Logo-removebg-preview.png" alt="DIJIT Logo" class="sidebar-logo-img"><span>Consultancy</span></a></div>
            <nav class="sidebar-nav">
                <div class="nav-group"><div class="nav-group-title">Overview</div><a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a></div>
                <div class="nav-group">
                    <div class="nav-group-title">Workflow</div>
                    <a href="client-reqs.html" class="nav-item"><i data-lucide="clipboard-list"></i><span>Client Reqs</span></a>
                    <a href="sourcing.html" class="nav-item"><i data-lucide="users"></i><span>Sourcing</span></a>
                    <a href="resume-database.html" class="nav-item"><i data-lucide="search"></i><span>Resume Database</span></a>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">Management</div>
                    <a href="team-members.html" class="nav-item active"><i data-lucide="user-plus"></i><span>Team Members</span></a>
                    <a href="billing-plan.html" class="nav-item"><i data-lucide="credit-card"></i><span>Billing & Plan</span></a>
                    <a href="settings.html" class="nav-item"><i data-lucide="settings"></i><span>Settings</span></a>
                </div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left"><button class="toggle-sidebar"><i data-lucide="menu" style="width:20px;height:20px;"></i></button></div>
                <div class="header-right"><div class="avatar" style="cursor:pointer;">PF</div></div>
            </header>

            <main class="main-content fade-in">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Team Members</h1>
                        <p class="text-muted" style="font-size:0.875rem; margin-top:2px;">Manage your recruiters and agency admins.</p>
                    </div>
                    <button class="btn btn-primary" id="inviteBtn"><i data-lucide="user-plus" style="width:16px;height:16px;"></i> Invite Member</button>
                </div>

                <div class="member-grid" id="memberGrid">
                    <!-- Members rendered via JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Invite Modal -->
    <div class="modal-overlay" id="inviteModal">
        <div class="modal-box">
            <h3>Invite Team Member</h3>
            <div class="form-group"><label>Full Name</label><input type="text" id="invName" placeholder="e.g. Jane Doe"></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="invEmail" placeholder="jane@peoplefirst.com"></div>
            <div class="form-group"><label>Role</label><select id="invRole"><option>Recruiter</option><option>Admin</option><option>Sourcing Analyst</option></select></div>
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
                <button class="btn btn-outline" id="cancelInvite">Cancel</button>
                <button class="btn btn-primary" id="sendInvite">Send Invite</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Invitation sent successfully!</div>

    <script src="js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const members = [
            { name: 'Priya N.', email: 'priya@peoplefirst.com', role: 'Admin' },
            { name: 'Rahul S.', email: 'rahul@peoplefirst.com', role: 'Recruiter' },
            { name: 'Vikram P.', email: 'vikram@peoplefirst.com', role: 'Recruiter' },
            { name: 'Sneha D.', email: 'sneha@peoplefirst.com', role: 'Sourcing Analyst' },
        ];

        function renderMembers() {
            const grid = document.getElementById('memberGrid');
            grid.innerHTML = '';
            members.forEach(m => {
                grid.innerHTML += `
                    <div class="member-card">
                        <div class="member-actions"><button class="btn-ghost btn-icon"><i data-lucide="more-horizontal" style="width:16px;height:16px;"></i></button></div>
                        <div class="member-avatar">${m.name.charAt(0)}</div>
                        <div class="member-name">${m.name}</div>
                        <div class="member-email">${m.email}</div>
                        <div class="member-role">${m.role}</div>
                    </div>
                `;
            });
            if (window.lucide) lucide.createIcons();
        }
        renderMembers();

        document.getElementById('inviteBtn').addEventListener('click', () => document.getElementById('inviteModal').classList.add('open'));
        document.getElementById('cancelInvite').addEventListener('click', () => document.getElementById('inviteModal').classList.remove('open'));
        document.getElementById('sendInvite').addEventListener('click', () => {
            const name = document.getElementById('invName').value;
            const email = document.getElementById('invEmail').value;
            const role = document.getElementById('invRole').value;
            if(name && email) {
                members.push({ name, email, role: role + ' (Pending)' });
                renderMembers();
                document.getElementById('inviteModal').classList.remove('open');
                document.getElementById('invName').value = ''; document.getElementById('invEmail').value = '';
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            }
        });
    });
    </script>
</body>
</html>
